<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Starless</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="topbar">
        <input type="text" id="search" placeholder="Search a star or constellation">
    </header>
    <main>
        <canvas id="sky"></canvas>
    </main>
    <footer id="controls">
        <input type="range" id="time-slider" min="0" max="1440" value="720">
        <span id="time-label"></span>
    </footer>
    <script src="astronomy.js"></script>
    <script src="app.js"></script>
</body>
</html>
