<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Starless</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="topbar">
        <input type="text" id="search" placeholder="Search a star or constellation">
        <div id="location-display">
            <input type="number" id="lat-input" placeholder="Latitude" step="0.01">
            <input type="number" id="lon-input" placeholder="Longitude" step="0.01">
            <button id="set-location">Set</button>
            <span id="location-label"></span>
        </div>
    </header>
    <main>
        <canvas id="sky"></canvas>
        <div id="star-tooltip"></div>
    </main>
    <footer id="controls">
        <input type="range" id="time-slider" min="0" max="1440" value="720">
        <span id="time-label"></span>
    </footer>
    <script src="astronomy.js"></script>
    <script src="app.js"></script>
</body>
</html>
